name: Sync Loki buckets to Dune

on:
  schedule:
    # 00:10, 06:10, 12:10, 18:10 UTC - ten minutes past each 6h boundary
    # so late-arriving logs are ingested before the bucket is queried.
    - cron: "10 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      lookback:
        description: "How many closed 6h buckets to re-query (use a large number to backfill)"
        required: false
        default: "3"

permissions:
  contents: write

concurrency:
  group: loki-dune-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch from Loki and publish to Dune
        env:
          GLC_TOKEN: ${{ secrets.GLC_TOKEN }}
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          LOOKBACK_BUCKETS: ${{ github.event.inputs.lookback || '3' }}
        run: python sync.py

      - name: Commit updated cache
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/buckets.csv
          if git diff --staged --quiet; then
            echo "no cache changes to commit"
          else
            git commit -m "data: buckets through $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
