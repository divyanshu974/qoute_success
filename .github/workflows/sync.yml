name: Sync Loki buckets to Dune

on:
  schedule:
    # Once a day at 00:10 UTC. Each run pushes the 28 closed 6h buckets
    # ending at 00:00 UTC, i.e. the last 7 full UTC days. The 10 minutes
    # give late-arriving logs time to be ingested before the newest
    # bucket is queried.
    - cron: "10 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the CSV instead of uploading to Dune"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: loki-dune-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Fetch last 7 days from Loki and publish to Dune
        env:
          GLC_TOKEN: ${{ secrets.GLC_TOKEN }}
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: python sync.py ${{ inputs.dry_run && '--dry-run' || '' }}
