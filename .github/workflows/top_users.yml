name: Fetch Loki logs

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Start, UTC (inclusive)"
        default: "2026-10-01T20:21:00Z"
      end:
        description: "End, UTC (exclusive)"
        default: "2026-10-02T18:38:00Z"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Fetch logs from Loki
        env:
          GLC_TOKEN: ${{ secrets.GLC_TOKEN }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: python top_users.py --start "$START" --end "$END"

      - name: Save logs to this run
        uses: actions/upload-artifact@v4
        with:
          name: loki-logs
          path: out/
          retention-days: 30
