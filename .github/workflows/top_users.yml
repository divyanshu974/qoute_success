name: Top users by quote rows

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days back (1-7)"
        default: "2"
      top:
        description: "How many users to print"
        default: "100"

permissions:
  contents: read

jobs:
  top-users:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Print top users by row count
        env:
          GLC_TOKEN: ${{ secrets.GLC_TOKEN }}
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
          DAYS: ${{ inputs.days }}
          TOP: ${{ inputs.top }}
        run: python top_users.py --days "$DAYS" --top "$TOP"
